name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - build/bluewater-v8-docs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs-material pyyaml
      - run: python -B tools/locale-guard/locale_guard.py check
      - run: python -B tools/check-docs.py
      - run: mkdocs build --strict --config-file docs/mkdocs.yml
